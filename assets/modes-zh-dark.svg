<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 270" width="920" height="270" role="img" aria-label="UserSpec 审查深度档位：glance、gate、stress（深色）">
  <defs>
    <style>
      .outer { fill: #16181d; stroke: #2c313c; stroke-width: 1.5; rx: 18; }
      .card { fill: #1d2027; stroke: #313744; stroke-width: 1.25; rx: 14; }
      .card-default { fill: #1d2027; stroke: #eb7a53; stroke-width: 2; rx: 14; }
      .eyebrow { font-family: "PingFang SC", "Microsoft YaHei", ui-monospace, sans-serif; font-size: 11.5px; font-weight: 700; fill: #9ca3af; letter-spacing: 0.04em; }
      .mode-tag { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 15px; font-weight: 800; fill: #f3f4f6; }
      .mode-tag-accent { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 15px; font-weight: 800; fill: #eb7a53; }
      .title { font-family: "PingFang SC", "Microsoft YaHei", -apple-system, sans-serif; font-size: 14.5px; font-weight: 700; fill: #f9fafb; }
      .body { font-family: "PingFang SC", "Microsoft YaHei", -apple-system, sans-serif; font-size: 12px; fill: #9ca3af; }
      .pill-default { fill: #35211a; stroke: #6e3927; stroke-width: 1; rx: 9; }
      .pill-default-txt { font-family: "PingFang SC", "Microsoft YaHei", sans-serif; font-size: 10px; font-weight: 700; fill: #f28b66; }
      .pill-foot { fill: #252932; rx: 8; }
      .pill-foot-sage { fill: #182c28; rx: 8; }
      .foot-txt { font-family: "PingFang SC", "Microsoft YaHei", sans-serif; font-size: 11px; font-weight: 700; fill: #d1d5db; }
      .foot-txt-sage { font-family: "PingFang SC", "Microsoft YaHei", sans-serif; font-size: 11px; font-weight: 700; fill: #63c7b2; }
      .dot-sage { fill: #5cc4ae; rx: 2.5; }
      .dot-accent { fill: #eb7a53; rx: 2.5; }
      .dot-off { fill: #313744; rx: 2.5; }
    </style>
  </defs>

  <rect class="outer" x="1" y="1" width="918" height="268"/>

  <!-- Top Header -->
  <circle cx="34" cy="30" r="5" fill="#5cc4ae"/>
  <text class="eyebrow" x="48" y="34">审查深度档位 · GLANCE / GATE / STRESS</text>

  <!-- Card 1: glance -->
  <rect class="card" x="26" y="54" width="276" height="192"/>
  <text class="mode-tag" x="44" y="84">glance</text>
  <rect class="dot-sage" x="218" y="74" width="18" height="6"/>
  <rect class="dot-off" x="240" y="74" width="18" height="6"/>
  <rect class="dot-off" x="262" y="74" width="18" height="6"/>

  <text class="title" x="44" y="114">5 秒首屏速测</text>
  <text class="body" x="44" y="138">• 仅针对入口首屏做阶段一盲测</text>
  <text class="body" x="44" y="158">• 观感层级与双视口排版体检</text>
  <text class="body" x="44" y="178">• 排查开发腔、裸露枚举与黑话</text>
  <rect class="pill-foot-sage" x="44" y="198" width="94" height="24"/>
  <text class="foot-txt-sage" x="91" y="214" text-anchor="middle">仅出报告</text>

  <!-- Card 2: gate (default) -->
  <rect class="card-default" x="322" y="54" width="276" height="192"/>
  <text class="mode-tag-accent" x="340" y="84">gate</text>
  <rect class="pill-default" x="386" y="69" width="46" height="20"/>
  <text class="pill-default-txt" x="409" y="83" text-anchor="middle">默认</text>
  <rect class="dot-accent" x="514" y="74" width="18" height="6"/>
  <rect class="dot-accent" x="536" y="74" width="18" height="6"/>
  <rect class="dot-off" x="558" y="74" width="18" height="6"/>

  <text class="title" x="340" y="114">标准三阶段门禁</text>
  <text class="body" x="340" y="138">• 阶段一：5 秒首屏与去开发腔门禁</text>
  <text class="body" x="340" y="158">• 阶段二：无提示全功能与工作流跑通</text>
  <text class="body" x="340" y="178">• 阶段三：流畅度 + 5+ 条无 F5 联动</text>
  <rect class="pill-foot" x="340" y="198" width="106" height="24"/>
  <text class="foot-txt" x="393" y="214" text-anchor="middle">确认后修复</text>

  <!-- Card 3: stress -->
  <rect class="card" x="618" y="54" width="276" height="192"/>
  <text class="mode-tag" x="636" y="84">stress</text>
  <rect class="dot-accent" x="810" y="74" width="18" height="6"/>
  <rect class="dot-accent" x="832" y="74" width="18" height="6"/>
  <rect class="dot-accent" x="854" y="74" width="18" height="6"/>

  <text class="title" x="636" y="114">极限边界压测</text>
  <text class="body" x="636" y="138">• 包含 gate 全量流程 + 动态缩放</text>
  <text class="body" x="636" y="158">• 高频连点防重与 0→1→N→0 边界</text>
  <text class="body" x="636" y="178">• 给出冗余困惑控件的删减建议</text>
  <rect class="pill-foot" x="636" y="198" width="106" height="24"/>
  <text class="foot-txt" x="689" y="214" text-anchor="middle">确认后修复</text>
</svg>
