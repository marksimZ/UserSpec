<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" width="960" height="300" role="img" aria-label="UserSpec Zero-Spoiler Three-Stage Gatekept Protocol">
  <defs>
    <style>
      .outer { fill: #faf6f0; stroke: #e5ddd0; stroke-width: 1.5; rx: 16; }
      .card { fill: #ffffff; stroke: #1f2937; stroke-width: 1.5; rx: 12; }
      .gate { fill: #fff7ed; stroke: #c25e3e; stroke-width: 1.75; rx: 10; }
      .wall { stroke: #dc2626; stroke-width: 2; stroke-dasharray: 6 5; }
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Helvetica, Arial, sans-serif; font-size: 13px; font-weight: 800; fill: #111827; }
      .gate-txt { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 10px; font-weight: 800; fill: #b04b2b; }
      .wall-label { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 10.5px; font-weight: 700; fill: #dc2626; }
      .body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Helvetica, Arial, sans-serif; font-size: 11px; fill: #4b5563; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 10px; fill: #2f6f62; font-weight: 700; }
      .mono-warn { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 10px; fill: #c25e3e; font-weight: 700; }
      .badge { fill: #1f2937; rx: 6; }
      .badge-sage { fill: #2f6f62; rx: 6; }
      .badge-accent { fill: #c25e3e; rx: 6; }
      .badge-txt { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 10px; font-weight: 700; fill: #ffffff; }
      .arrow { stroke: #1f2937; stroke-width: 1.75; fill: none; }
      .arrow-accent { stroke: #c25e3e; stroke-width: 1.75; fill: none; }
    </style>
    <marker id="head" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#1f2937"/>
    </marker>
    <marker id="head-accent" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#c25e3e"/>
    </marker>
  </defs>

  <rect class="outer" x="1" y="1" width="958" height="298"/>

  <!-- Blind Isolation Wall -->
  <line class="wall" x1="202" y1="22" x2="202" y2="278"/>
  <rect x="130" y="12" width="144" height="20" rx="10" fill="#fef2f2" stroke="#fecaca" stroke-width="1"/>
  <text class="wall-label" x="202" y="26" text-anchor="middle">ZERO-SPOILER WALL</text>

  <!-- Step 0: Coordinator -->
  <rect class="card" x="20" y="48" width="164" height="196"/>
  <rect class="badge-sage" x="32" y="60" width="96" height="20"/>
  <text class="badge-txt" x="80" y="74" text-anchor="middle">COORDINATOR</text>
  <text class="title" x="32" y="100">Host Agent</text>
  <text class="body" x="32" y="122">• Starts server / app</text>
  <text class="body" x="32" y="141">• Builds secret Feature</text>
  <text class="body" x="32" y="156">  &amp; Workflow Ledger</text>
  <text class="body" x="32" y="176">• Passes bare URL/PID</text>
  <text class="body" x="32" y="196">• Patches approved fixes</text>
  <text class="mono" x="32" y="226">no spoilers cross →</text>

  <line class="arrow" x1="184" y1="146" x2="216" y2="146" marker-end="url(#head)"/>

  <!-- Stage 1 -->
  <rect class="card" x="220" y="48" width="174" height="196"/>
  <rect class="badge" x="232" y="60" width="72" height="20"/>
  <text class="badge-txt" x="268" y="74" text-anchor="middle">STAGE 1</text>
  <text class="title" x="232" y="100">5s First Impression</text>
  <text class="body" x="232" y="122">• 5-sec comprehension</text>
  <text class="body" x="232" y="142">• Visual craft &amp; layout</text>
  <text class="body" x="232" y="162">• Zero dev-jargon / enums</text>
  <text class="body" x="232" y="182">• 1440px + 390px views</text>
  <text class="mono-warn" x="232" y="226">no deep CRUD yet</text>

  <!-- Gate 1 Pill -->
  <line class="arrow-accent" x1="394" y1="146" x2="410" y2="146"/>
  <rect class="gate" x="410" y="96" width="54" height="100"/>
  <text class="gate-txt" x="437" y="132" text-anchor="middle">🔒</text>
  <text class="gate-txt" x="437" y="150" text-anchor="middle">GATE</text>
  <text class="gate-txt" x="437" y="166" text-anchor="middle">01</text>
  <line class="arrow-accent" x1="464" y1="146" x2="478" y2="146" marker-end="url(#head-accent)"/>

  <!-- Stage 2 -->
  <rect class="card" x="482" y="48" width="188" height="196"/>
  <rect class="badge-accent" x="494" y="60" width="72" height="20"/>
  <text class="badge-txt" x="530" y="74" text-anchor="middle">STAGE 2</text>
  <text class="title" x="494" y="100">Unguided Discovery</text>
  <text class="body" x="494" y="122">• Pass 1: Zero-hint full</text>
  <text class="body" x="494" y="137">  workflow completion</text>
  <text class="body" x="494" y="157">• Pass 2: Goal-only nudge</text>
  <text class="body" x="494" y="172">  for Ghost Features</text>
  <text class="body" x="494" y="192">• Diff vs. Secret Ledger</text>
  <text class="mono-warn" x="494" y="226">X/N &amp; Y/M scored</text>

  <!-- Gate 2 Pill -->
  <line class="arrow-accent" x1="670" y1="146" x2="686" y2="146"/>
  <rect class="gate" x="686" y="96" width="54" height="100"/>
  <text class="gate-txt" x="713" y="132" text-anchor="middle">🔒</text>
  <text class="gate-txt" x="713" y="150" text-anchor="middle">GATE</text>
  <text class="gate-txt" x="713" y="166" text-anchor="middle">02</text>
  <line class="arrow-accent" x1="740" y1="146" x2="754" y2="146" marker-end="url(#head-accent)"/>

  <!-- Stage 3 -->
  <rect class="card" x="758" y="48" width="182" height="196"/>
  <rect class="badge" x="770" y="60" width="72" height="20"/>
  <text class="badge-txt" x="806" y="74" text-anchor="middle">STAGE 3</text>
  <text class="title" x="770" y="100">Fluency &amp; Linkage</text>
  <text class="body" x="770" y="122">• Feedback &amp; CLS check</text>
  <text class="body" x="770" y="142">• Double-submit &amp; drafts</text>
  <text class="body" x="770" y="162">• 5+ cross-view syncs</text>
  <text class="body" x="770" y="182">• 0 → 1 → N → 0 lifecycle</text>
  <text class="mono-warn" x="770" y="226">F5 refresh forbidden</text>

  <!-- Bottom fresh-eyes loop bar -->
  <path class="arrow-accent" d="M 437 196 L 437 272 L 307 272 L 307 248" marker-end="url(#head-accent)"/>
  <path class="arrow-accent" d="M 713 196 L 713 272 L 576 272 L 576 248" marker-end="url(#head-accent)"/>
  <rect x="295" y="261" width="430" height="20" rx="10" fill="#fff7ed" stroke="#efc9b8" stroke-width="1"/>
  <text class="gate-txt" x="510" y="275" text-anchor="middle">each gate: confirm fixes → patch → brand-new blind agent retest</text>
</svg>
